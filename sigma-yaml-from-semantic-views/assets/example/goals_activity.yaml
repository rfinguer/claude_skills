          formula: '[Custom SQL/CANCELS]'
          name: CANCELS
          hidden: true
        - id: ap_b_rejects
          formula: '[Custom SQL/REJECTS]'
          name: REJECTS
          hidden: true
        - id: ap_b_exits
          formula: '[Custom SQL/EXITS]'
          name: EXITS
          hidden: true
        - id: ap_b_net_exits
          formula: '[Custom SQL/NET_EXITS]'
          name: NET_EXITS
          hidden: true
        - id: ap_b_renewals
          formula: '[Custom SQL/RENEWALS]'
          name: RENEWALS
          hidden: true
        # ---- field parameter z_Fields_PropHierarchy (control act-hierarchy) ----
        - id: ap_g_hier
          formula: 'Switch([act-hierarchy], "Rollup", [Rollup], "LEVEL_1", [LEVEL_1], "LEVEL_2", [LEVEL_2], "Level 3", [LEVEL_3], "Region", [Region], "Status", [QTR Status], "Rollup Entity", [Rollup Entity], "Entity", [Entity Name], [Region])'
          name: Hierarchy
        # ---- DAX building blocks (hidden) ----
        - id: ap_h00
          formula: 'Sum([ITEMS])'
          name: 'h Items'
          hidden: true
          format:
            kind: number
            formatString: ',.0f'
        - id: ap_h01
          formula: 'Zn(Sum([GROSS_ORDERS]))'
          name: 'h Gross Order'
          hidden: true
          format:
            kind: number
            formatString: ',.0f'
        - id: ap_h02
          formula: 'Zn(Sum([CANCELS]))'
          name: 'h Cancel'
          hidden: true
          format:
            kind: number
            formatString: ',.0f'
        - id: ap_h03
          formula: 'Zn(Sum([REJECTS]))'
          name: 'h Reject'
          hidden: true
          format:
            kind: number
            formatString: ',.0f'
        - id: ap_h04
          formula: '[h Gross Order] - [h Cancel] - [h Reject]'
          name: 'h Net Order'
          hidden: true
          format:
            kind: number
            formatString: ',.0f'
        - id: ap_h05
          formula: 'Sum([EXITS])'
          name: 'h Exits'
          hidden: true
          format:
            kind: number
            formatString: ',.0f'
        - id: ap_h06
          formula: 'Sum([NET_EXITS])'
          name: 'h Net Exits'
          hidden: true
          format:
            kind: number
            formatString: ',.0f'
        - id: ap_h07
          formula: 'Sum([RENEWALS])'
          name: 'h Renewals'
          hidden: true
          format:
            kind: number
            formatString: ',.0f'
        - id: ap_h08
          formula: 'Sum([TREND_ITEMS]) / Sum([SNAPSHOT_ITEMS])'
          name: 'h Trend'
          hidden: true
          format:
            kind: number
            formatString: ',.1%'
        - id: ap_h09
          formula: 'Sum([TREND_GOAL_ITEMS]) / [h Items]'
          name: 'h Goal Adj'
          hidden: true
          format:
            kind: number
            formatString: ',.1%'
        - id: ap_h10
          formula: '[h Trend] - [h Goal Adj]'
          name: 'h Lt30 Var Pct'
          hidden: true
          format:
            kind: number
            formatString: ',.1%'
        - id: ap_h11
          formula: '[h Lt30 Var Pct] * [h Items]'
          name: 'h Lt30 Var Num'
          hidden: true
          format:
            kind: number
            formatString: ',.0f'
        - id: ap_h12
          formula: 'Sum([LIST_PRICE_AMT]) / [h Items]'
          name: 'h Price per Item'
          hidden: true
          format:
            kind: number
            formatString: '$,.2f'
        - id: ap_h13
          formula: '(Sum([UTIL_ACTUAL_ITEMS]) - Sum([UTIL_GOAL_ITEMS])) / [h Items]'
          name: 'h Util Var'
          hidden: true
          format:
            kind: number
            formatString: ',.1%'
        - id: ap_h14
          formula: 'Zn((Sum([NEW_PRICE_T30]) - Sum([PRIOR_PRICE_T30])) / Sum([PRIOR_PRICE_T30])) - (Zn(Sum([NEW_GROWTH_GOAL_T30]) / Sum([NEW_PRIOR_GOAL_T30])) + Zn(Sum([RPT_GROWTH_GOAL_T30]) / Sum([RPT_PRIOR_GOAL_T30]))) / 2'
          name: 'h Price Var'
          hidden: true
          format:
            kind: number
            formatString: ',.1%'
        # ---- visible measures (Power BI display name; description = DAX measure) ----
        - id: ap_m00
          formula: 'Zn([h Util Var]) * [act-w-util] + Zn([h Lt30 Var Pct]) * [act-w-trend] + Zn([h Price Var]) * [act-w-price]'
          name: 'Weighted Score'
          description: 'DAX measure [Weighted Score]'
          format:
