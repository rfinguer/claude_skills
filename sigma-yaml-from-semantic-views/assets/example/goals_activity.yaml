          name: Hierarchy
        # ---- DAX building blocks (hidden) ----
        - id: at_h00
          formula: 'Sum([ITEMS])'
          name: 'h Items'
          hidden: true
          format:
            kind: number
            formatString: ',.0f'
        - id: at_h01
          formula: 'Zn(Sum([GROSS_ORDERS]))'
          name: 'h Gross Order'
          hidden: true
          format:
            kind: number
            formatString: ',.0f'
        - id: at_h02
          formula: 'Zn(Sum([CANCELS]))'
