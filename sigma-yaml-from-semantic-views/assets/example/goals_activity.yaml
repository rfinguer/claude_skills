    - id: wk_data001
      kind: table
      name: Activity Weekly Data
      source:
        connectionId: REPLACE_WITH_SIGMA_CONNECTION_ID
        kind: sql
        statement: |-
          -- Goals Dashboard - Activity / "Leads & Visits per Available Item" (PROJ-275). One row per entity x week ending.
          -- Visual filter DimCalendar[xWeeksAgo] > 0 AND <= 52; page filters xDaysAgo_1DayLag >= 0, xYearsAgo_1DayLag 0..1.
          -- Not affected by the Relative Date slicer (interaction off in Power BI).
          -- Report filters: EntityID not blank, only entities that have DimItem[ActiveFlag] = 1 items.
          WITH occ_props AS (
            SELECT DISTINCT ENTITY_ID FROM SEMANTIC_VIEW(MY_DB.MY_SCHEMA.SNAPSHOT_SV
              DIMENSIONS DIM_ENTITY.ENTITY_ID, DIM_ITEM.ACTIVE_FLAG)
            WHERE ACTIVE_FLAG = 1 AND ENTITY_ID IS NOT NULL
          )
          SELECT w.ENTITY_ID AS ENTITY_ID, w.ENTITY_NAME, w.REGION, w.STATUS, w.STATUS_QTR AS STATUS_QTR,
                 w.STATUS_YTD AS STATUS_YTD, w.ROLLUP, w.ROLLUP_ENTITY_NAME AS ROLLUP_ENTITY_NAME, w.LEVEL_1, w.LEVEL_2, w.LEVEL_3,
                 w.WEEKENDING::DATE AS WEEK_ENDING,
                 w.NUM_NET_CONVERSIONS, w.NUM_VISITS, w.NUM_LEADS, w.NUM_WEEKLY_AVAILABLE_ITEMS,
                 w.NUM_NET_CONVERSIONS_SAME_WEEK_PY, w.NUM_VISITS_SAME_WEEK_PY, w.NUM_LEADS_SAME_WEEK_PY,
                 w.NUM_WEEKLY_AVAILABLE_ITEMS_SAME_WEEK_PY
          FROM SEMANTIC_VIEW(MY_DB.MY_SCHEMA.SNAPSHOT_SV
            DIMENSIONS DIM_ENTITY.ENTITY_ID, DIM_ENTITY.ENTITY_NAME, DIM_ENTITY.REGION, DIM_ENTITY.STATUS, DIM_ENTITY.STATUS_QTR,
                       DIM_ENTITY.STATUS_YTD, DIM_ENTITY.ROLLUP, DIM_ENTITY.ROLLUP_ENTITY_NAME, DIM_ENTITY.LEVEL_1, DIM_ENTITY.LEVEL_2, DIM_ENTITY.LEVEL_3,
                       DIMCALENDAR.WEEKENDING
            METRICS EXIT_FACT.NUM_NET_CONVERSIONS, EXIT_FACT.NUM_VISITS, EXIT_FACT.NUM_LEADS, NUM_WEEKLY_AVAILABLE_ITEMS,
                    EXIT_FACT_PY.NUM_NET_CONVERSIONS_SAME_WEEK_PY, EXIT_FACT_PY.NUM_VISITS_SAME_WEEK_PY,
                    EXIT_FACT_PY.NUM_LEADS_SAME_WEEK_PY, NUM_WEEKLY_AVAILABLE_ITEMS_SAME_WEEK_PY
            WHERE DIMCALENDAR.XWEEKSAGO > 0 AND DIMCALENDAR.XWEEKSAGO <= 52
              AND DIMCALENDAR.XDAYSAGO_1DAYLAG >= 0 AND DIMCALENDAR.XYEARSAGO_1DAYLAG BETWEEN 0 AND 1) w
          JOIN occ_props o ON o.ENTITY_ID = w.ENTITY_ID
      columns:
        - id: wk_d_entity_id
          formula: '[Custom SQL/ENTITY_ID]'
          name: Entity ID
        - id: wk_d_entity_name
          formula: '[Custom SQL/ENTITY_NAME]'
          name: Entity Name
        - id: wk_d_region
          formula: '[Custom SQL/REGION]'
          name: Region
        - id: wk_d_status
          formula: '[Custom SQL/STATUS]'
          name: Status
        - id: wk_d_status_qtr
          formula: '[Custom SQL/STATUS_QTR]'
          name: QTR Status
        - id: wk_d_status_ytd
          formula: '[Custom SQL/STATUS_YTD]'
          name: YTD Status
        - id: wk_d_rollup
          formula: '[Custom SQL/ROLLUP]'
          name: Rollup
        - id: wk_d_rollup_entity_name
          formula: '[Custom SQL/ROLLUP_ENTITY_NAME]'
          name: Rollup Entity
        - id: wk_d_level_1
          formula: '[Custom SQL/LEVEL_1]'
          name: LEVEL_1
        - id: wk_d_level_2
          formula: '[Custom SQL/LEVEL_2]'
          name: LEVEL_2
        - id: wk_d_level_3
          formula: '[Custom SQL/LEVEL_3]'
          name: LEVEL_3
        - id: wk_weekend
          formula: '[Custom SQL/WEEK_ENDING]'
          name: WeekEnding
        - id: wk_b_num_net_conversions
          formula: '[Custom SQL/NUM_NET_CONVERSIONS]'
          name: NUM_NET_CONVERSIONS
        - id: wk_b_num_visits
          formula: '[Custom SQL/NUM_VISITS]'
          name: NUM_VISITS
        - id: wk_b_num_leads
          formula: '[Custom SQL/NUM_LEADS]'
          name: NUM_LEADS
        - id: wk_b_num_weekly_available_items
          formula: '[Custom SQL/NUM_WEEKLY_AVAILABLE_ITEMS]'
          name: NUM_WEEKLY_AVAILABLE_ITEMS
        - id: wk_b_num_net_conversions_same_week_py
          formula: '[Custom SQL/NUM_NET_CONVERSIONS_SAME_WEEK_PY]'
          name: NUM_NET_CONVERSIONS_SAME_WEEK_PY
        - id: wk_b_num_visits_same_week_py
          formula: '[Custom SQL/NUM_VISITS_SAME_WEEK_PY]'
          name: NUM_VISITS_SAME_WEEK_PY
        - id: wk_b_num_leads_same_week_py
          formula: '[Custom SQL/NUM_LEADS_SAME_WEEK_PY]'
          name: NUM_LEADS_SAME_WEEK_PY
        - id: wk_b_num_weekly_available_items_same_week_py
          formula: '[Custom SQL/NUM_WEEKLY_AVAILABLE_ITEMS_SAME_WEEK_PY]'
          name: NUM_WEEKLY_AVAILABLE_ITEMS_SAME_WEEK_PY
    - id: act_chart1
      kind: combo-chart
      name: Leads & Visits per Available Item
      source:
        kind: table
        elementId: wk_data001
      columns:
        - id: ch_week01
          formula: '[Activity Weekly Data/WeekEnding]'
          name: WeekEnding
        - id: ch_c01
          formula: 'Sum([Activity Weekly Data/NUM_NET_CONVERSIONS]) / Sum([Activity Weekly Data/NUM_VISITS])'
          name: 'Closing Ratio CY'
          description: 'DAX measure [% Closing Ratio]'
          format:
            kind: number
            formatString: ',.2%'
        - id: ch_c02
          formula: 'Sum([Activity Weekly Data/NUM_NET_CONVERSIONS_SAME_WEEK_PY]) / Sum([Activity Weekly Data/NUM_VISITS_SAME_WEEK_PY])'
          name: 'Closing Ratio PY'
          description: 'DAX measure [% Closing Ratio Same Week PY]'
          format:
            kind: number
            formatString: ',.2%'
        - id: ch_c03
          formula: '([Closing Ratio CY] - [Closing Ratio PY]) / [Closing Ratio PY]'
          name: '% Closing Ratio Weekly YoY Chg (1st Axis)'
          description: 'DAX measure [% Closing Ratio Weekly YoY Chg]'
          format:
            kind: number
            formatString: ',.2%'
        - id: ch_c04
          formula: 'Sum([Activity Weekly Data/NUM_LEADS]) / Sum([Activity Weekly Data/NUM_WEEKLY_AVAILABLE_ITEMS])'
          name: 'h Leads per EU'
          description: 'DAX measure [# Leads per Available Item]'
          format:
            kind: number
            formatString: ',.2f'
        - id: ch_c05
          formula: 'Sum([Activity Weekly Data/NUM_LEADS_SAME_WEEK_PY]) / Sum([Activity Weekly Data/NUM_WEEKLY_AVAILABLE_ITEMS_SAME_WEEK_PY])'
          name: 'h Leads per EU PY'
          description: 'DAX measure [# Leads per Available Item Same Week PY]'
          format:
            kind: number
            formatString: ',.2f'
        - id: ch_c06
          formula: '([h Leads per EU] - [h Leads per EU PY]) / [h Leads per EU PY]'
          name: '% Leads per Available Item Var'
          description: 'DAX measure [% Leads per Available Item Var]'
          format:
            kind: number
            formatString: ',.2%'
        - id: ch_c07
          formula: 'Sum([Activity Weekly Data/NUM_VISITS]) / Sum([Activity Weekly Data/NUM_WEEKLY_AVAILABLE_ITEMS])'
          name: 'h Visits per EU'
          description: 'DAX measure [# Visits per Available Item]'
          format:
            kind: number
            formatString: ',.2f'
        - id: ch_c08
          formula: 'Sum([Activity Weekly Data/NUM_VISITS_SAME_WEEK_PY]) / Sum([Activity Weekly Data/NUM_WEEKLY_AVAILABLE_ITEMS_SAME_WEEK_PY])'
          name: 'h Visits per EU PY'
          description: 'DAX measure [# Visits per Available Item Same Week PY]'
          format:
            kind: number
            formatString: ',.2f'
        - id: ch_c09
          formula: '([h Visits per EU] - [h Visits per EU PY]) / [h Visits per EU PY]'
          name: '% Visits per Available Item Var'
          description: 'DAX measure [% Visits per Available Item Var]'
          format:
            kind: number
            formatString: ',.2%'
      xAxis:
        columnId: ch_week01
      yAxis:
        columnIds:
          - ch_c03
          - columnId: ch_c06
            type: line
          - columnId: ch_c09
            type: line
      yAxis2:
        columnIds:
          - ch_c06
          - ch_c09
      tooltip:
        columns:
          - id: ch_c01
          - id: ch_c02
